<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Task</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Add New Task</h1>
            <a href="/" class="btn btn-light">← Back</a>
        </header>

        <div class="form-section">
            <form th:action="@{/add}" method="post" th:object="${task}">
                <div class="form-group">
                    <label for="title">Title <span class="required">*</span></label>
                    <input type="text" id="title" name="title" th:field="*{title}" 
                           required placeholder="Enter task title" class="form-input">
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" th:field="*{description}" 
                              placeholder="Enter task description" class="form-textarea" rows="4"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="category">Category <span class="required">*</span></label>
                        <select id="category" name="category" th:field="*{category}" required class="form-select">
                            <option value="">Choose a category</option>
                            <option th:each="cat : ${categories}" th:value="${cat.name()}" th:text="${cat.label}"></option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="deadline">Deadline</label>
                        <input type="date" id="deadline" name="deadline" th:field="*{deadline}" class="form-input">
                    </div>
                </div>

                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status" th:field="*{status}" class="form-select">
                        <option value="PENDING">Pending</option>
                        <option value="DONE">Done</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Add Task</button>
                    <a href="/" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
